name: opengym

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC).
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework).
  # Always built from this repository (docker compose up --build).
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000            # internal port (nginx proxies here) — do not change
      - DATA_DIR=/data
      - COACH_CODEX_HOME=/codex
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP
      # ChatGPT/Codex refresh tokens are kept separate from app data and mounted only into the
      # API container. This directory is owned by the unprivileged Coach runtime.
      - ./data/codex:/codex

  # Postgres for users, WhatsApp profiles, chat log, events and consents (docs/SELF_HOSTING.md §10).
  # Per-user plans/workouts stay as JSON files in ./data for now. Set DATABASE_URL in .env to
  # postgres://levanta:${POSTGRES_PASSWORD}@db:5432/levanta and the api migrates db.json on first boot.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=levanta
      - POSTGRES_USER=levanta
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-levanta}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levanta -d levanta"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Daily backup of ./data (users, plans, workouts, WhatsApp profiles) into ./backups as a
  # dated tar.gz, keeping the last 30. Copy ./backups off the server (EasyPanel volume backup,
  # rclone to an S3/Storage Box, …) — a backup on the same disk is only half a backup.
  backup:
    image: postgres:16-alpine     # alpine + pg_dump
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/levanta-$$(date +%Y%m%d-%H%M).tar.gz
          tar -czf "$$f" -C / data --exclude='data/codex' --exclude='data/postgres' && echo "✓ backup $$f"
          [ -n "$$DATABASE_URL" ] && pg_dump "$$DATABASE_URL" | gzip > "$${f%.tar.gz}.sql.gz" && echo "✓ pg_dump"
          ls -1t /backups/levanta-*.tar.gz /backups/levanta-*.sql.gz 2>/dev/null | tail -n +61 | xargs -r rm -f
          sleep 86400
        done

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    # EasyPanel routes the domain to this port through its own proxy — no host port published.
    expose:
      - "80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
